name: 'Security Self-Service Secret Scan'
description: 'Scans a repository for secrets using TruffleHog with a custom detector config.'

inputs:
  path:
    description: 'Path to scan, relative to the checked-out repository.'
    required: false
    default: '.'
  since-commit:
    description: 'Commit SHA to scan from, exclusive. Pass the previous commit SHA from the calling workflow (github.event.before for push events).'
    required: true
  branch:
    description: 'Branch to scan. Pass the ref name from the calling workflow (github.ref_name).'
    required: true

runs:
  using: 'docker'
  image: 'docker://registry.jetbrains.team/p/sad/tools/trufflehog@sha256:72bba71ba5e0f2990b2074bb049f4f3a1ae1a77c7386cd535165b780d2a94761'
  args:
    - git
    - 'file://${{ inputs.path }}'
    - '--since-commit=${{ inputs.since-commit }}'
    - '--branch=${{ inputs.branch }}'
    - '--fail'
