name: 'Security Self-Service Secret Scan'
description: 'Scans a repository for secrets using TruffleHog with a custom detector config.'

inputs:
  path:
    description: 'Path to scan, relative to the checked-out repository.'
    required: false
    default: '.'
  since-commit:
    description: 'Commit SHA to scan from, exclusive. Pass the previous commit SHA from the calling workflow (github.event.before for push events).'
    required: true
  branch:
    description: 'Branch to scan. Pass the ref name from the calling workflow (github.ref_name).'
    required: true
  only-verified:
    description: 'If true, only report/fail on secrets verified as currently live (confirmed via API check), suppressing unverified and unknown matches. Defaults to false, which reports verified, unverified, and unknown results.'
    required: false
    default: 'false'

runs:
  using: 'docker'
  image: 'docker://registry.jetbrains.team/p/sad/tools/trufflehog@sha256:6112d8e49e53ebc950f17f29f8581262632788b30c3df9606a28f2df62b9151b'
  env:
    PRETTY_JSON_OUTPUT: 'true'
  args:
    - git
    - 'file://${{ inputs.path }}'
    - '--since-commit=${{ inputs.since-commit }}'
    - '--branch=${{ inputs.branch }}'
    - '--fail'
    - '--json'
    - "--results=${{ inputs.only-verified == 'true' && 'verified' || 'verified,unverified,unknown' }}"
